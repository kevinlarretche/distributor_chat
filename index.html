<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>AUDIO HOUSE — Store Advisor</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700&display=swap">
<style>
  :root {
    --paper:    #F5F1EA;
    --paper-2:  #EBE5D8;
    --paper-3:  #FFFCF7;
    --ink:      #16140F;
    --ink-2:    #3A3730;
    --ink-3:    #807A72;
    --rule:     rgba(22,20,15,0.08);
    --rule-2:   rgba(22,20,15,0.14);
    --teal:     #00A88A;
    --teal-ink: #006B57;
    --teal-tint:#E1ECE7;
    --gold:     #B69770;
    --app-height: 100vh;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    overflow-x: hidden;
    overscroll-behavior: none;
    background: var(--paper);
    color: var(--ink);
  }
  body {
    font-family: 'General Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.005em;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
  }
  ::selection { background: var(--ink); color: var(--paper); }

  /* Subtle paper grain */
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(rgba(22,20,15,0.025) 1px, transparent 1px),
      radial-gradient(rgba(22,20,15,0.018) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
  }

  .header, .chat-window, .footer-container { position: relative; z-index: 1; }

  .header {
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 0 28px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 50;
    padding-top: env(safe-area-inset-top);
    padding-left: max(28px, env(safe-area-inset-left));
    padding-right: max(28px, env(safe-area-inset-right));
    box-sizing: content-box;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .brand-mark { display: flex; flex-direction: column; gap: 5px; }
  .brand-name {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1;
  }
  .brand-name::after {
    content: '.';
    color: var(--gold);
    margin-left: 1px;
  }
  .brand-sub {
    font-size: 11px; font-weight: 500;
    letter-spacing: -0.005em;
    color: var(--ink-3);
    display: flex; align-items: center; gap: 7px; line-height: 1;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--teal);
    flex-shrink: 0;
  }
  .header-actions { display: flex; align-items: center; gap: 4px; }
  .icon-btn {
    background: none; border: none; color: var(--ink-3); cursor: pointer;
    width: 36px; height: 36px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }
  .icon-btn:hover { color: var(--ink); background: rgba(22,20,15,0.04); }

  .chat-window {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    scrollbar-width: thin;
    scrollbar-color: var(--rule-2) transparent;
    -webkit-overflow-scrolling: touch;
    width: 100%;
    max-width: 100%;
  }
  .chat-window::-webkit-scrollbar { width: 4px; }
  .chat-window::-webkit-scrollbar-track { background: transparent; }
  .chat-window::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 2px; }

  .message-wrapper {
    display: flex;
    flex-direction: column;
    animation: slideUp 0.4s ease-out both;
    width: 100%;
    max-width: 100%;
  }
  .message-wrapper.user { align-items: flex-end; }
  .message-wrapper.bot  { align-items: flex-start; }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bot-label {
    font-size: 11px; font-weight: 500;
    letter-spacing: -0.005em;
    color: var(--ink-3);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .bot-label::before {
    content: ''; display: block;
    width: 18px; height: 1px;
    background: var(--rule-2);
  }

  .message {
    padding: 14px 18px;
    font-size: 14.5px;
    line-height: 1.6;
    max-width: 78%;
    position: relative;
    word-wrap: break-word;
    overflow-wrap: break-word;
    word-break: break-word;
    letter-spacing: -0.005em;
    border-radius: 4px;
  }
  .message.user {
    background: var(--ink);
    color: var(--paper);
    border-radius: 4px 4px 0 4px;
    font-weight: 400;
  }
  .message.bot {
    background: var(--paper-3);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 0 4px 4px 4px;
    font-weight: 400;
  }
  .message.bot strong { font-weight: 600; color: var(--ink); }
  .message.bot em { font-style: italic; color: var(--ink-2); }
  .message.bot ul,
  .message.bot ol { padding-left: 18px; margin: 8px 0; }
  .message.bot li { margin: 4px 0; color: var(--ink-2); }
  .message.bot a {
    color: var(--teal-ink);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    word-break: break-all;
  }
  .message.bot a:hover { color: var(--ink); }
  .message.bot code {
    background: var(--paper-2);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 12px;
    font-family: 'General Sans', monospace;
    font-weight: 500;
    color: var(--ink);
  }
  .message.bot p { margin-bottom: 8px; }
  .message.bot p:last-child { margin-bottom: 0; }
  .message.bot h3 {
    font-size: 13.5px; font-weight: 600;
    letter-spacing: -0.02em;
    margin: 12px 0 6px 0;
    color: var(--ink);
  }
  .message-time {
    font-size: 11px; font-weight: 500;
    color: var(--ink-3);
    margin-top: 6px;
    letter-spacing: -0.005em;
  }

  #typing .message.bot { display: flex; gap: 5px; padding: 16px 18px; align-items: center; }
  .dot { width: 5px; height: 5px; background: var(--ink-3); border-radius: 50%; animation: pulseDot 1.4s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulseDot {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  .footer-container {
    background: var(--paper);
    border-top: 1px solid var(--rule);
    padding: 18px 28px 26px;
    flex-shrink: 0;
    padding-bottom: max(26px, env(safe-area-inset-bottom));
    padding-left: max(28px, env(safe-area-inset-left));
    padding-right: max(28px, env(safe-area-inset-right));
  }
  .quick-replies {
    display: flex; gap: 8px; margin-bottom: 14px;
    overflow-x: auto; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .quick-replies::-webkit-scrollbar { display: none; }
  .qr-btn {
    background: transparent;
    border: 1px solid var(--rule-2);
    color: var(--ink-2);
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: -0.005em;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'General Sans', sans-serif;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .qr-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
    background: rgba(22,20,15,0.03);
  }

  .input-wrapper {
    display: flex; align-items: center; gap: 10px;
    background: var(--paper-3);
    border: 1px solid var(--rule-2);
    border-radius: 4px;
    padding: 4px 4px 4px 18px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .input-wrapper:focus-within {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(22,20,15,0.06);
  }
  .input-wrapper input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 15.5px;
    font-weight: 400;
    color: var(--ink);
    font-family: 'General Sans', sans-serif;
    letter-spacing: -0.005em;
    padding: 11px 0;
    min-width: 0;
    width: 100%;
  }
  .input-wrapper input::placeholder { color: var(--ink-3); }

  .send-btn-wrapper { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
  .send-btn {
    background: var(--ink);
    border: none; width: 40px; height: 40px;
    border-radius: 4px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease, transform 0.15s ease;
    flex-shrink: 0; position: relative; z-index: 2;
  }
  .send-btn:hover { background: #000; }
  .send-btn:active { transform: scale(0.96); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .wave-ring {
    position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
    border: 1px solid rgba(22,20,15,0); border-radius: 4px;
    transform: translate(-50%, -50%) scale(1); pointer-events: none; z-index: 1;
  }
  .send-btn-wrapper.rippling .wave-ring { animation: waveExpand 0.7s ease-out forwards; }
  .send-btn-wrapper.rippling .wave-ring:nth-child(2) { animation-delay: 0.1s; }
  .send-btn-wrapper.rippling .wave-ring:nth-child(3) { animation-delay: 0.2s; }
  @keyframes waveExpand {
    0% { transform: translate(-50%, -50%) scale(1); border-color: rgba(22,20,15,0.4); }
    100% { transform: translate(-50%, -50%) scale(2.6); border-color: rgba(22,20,15,0); }
  }

  .powered-by {
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: var(--ink-3);
    margin-top: 14px;
  }
  .powered-by a {
    color: var(--ink-2);
    text-decoration: none;
    transition: color 0.25s ease;
    position: relative;
  }
  .powered-by a::after {
    content: ''; position: absolute; bottom: -2px; left: 0;
    width: 0; height: 1px; background: var(--ink);
    transition: width 0.3s ease;
  }
  .powered-by a:hover { color: var(--ink); }
  .powered-by a:hover::after { width: 100%; }

  .lang-wrapper { position: relative; z-index: 100; }
  .lang-dropdown {
    position: absolute; top: calc(100% + 8px); right: 0;
    background: var(--paper-3);
    border: 1px solid var(--rule-2);
    border-radius: 4px;
    overflow: hidden; min-width: 160px;
    opacity: 0; visibility: hidden; transform: translateY(-4px);
    transition: all 0.2s ease; z-index: 200;
    box-shadow:
      0 4px 8px rgba(22,20,15,0.04),
      0 16px 32px rgba(22,20,15,0.08);
  }
  .lang-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }
  .lang-option {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 11px 16px; background: none; border: none;
    color: var(--ink-2);
    font-family: 'General Sans', sans-serif;
    font-size: 13px; font-weight: 500;
    letter-spacing: -0.005em;
    cursor: pointer; transition: all 0.15s ease; text-align: left;
  }
  .lang-option:hover { background: var(--paper-2); color: var(--ink); }
  .lang-option.active { color: var(--ink); }
  .lang-option .lang-flag { font-size: 12px; line-height: 1; font-weight: 600; color: var(--ink-3); }
  .lang-option.active .lang-flag { color: var(--ink); }
  .lang-option .lang-check { margin-left: auto; opacity: 0; font-size: 11px; color: var(--teal); }
  .lang-option.active .lang-check { opacity: 1; }

  /* Mobile */
  @media (max-width: 640px) {
    .header {
      padding: 0 18px;
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
      height: 60px;
    }
    .brand-name { font-size: 16px; }
    .chat-window { padding: 22px 18px; gap: 18px; }
    .footer-container {
      padding: 14px 18px 18px;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
    }
    .message { max-width: 88%; padding: 12px 14px; font-size: 14px; }
    .input-wrapper { padding: 4px 4px 4px 14px; }
    .qr-btn { padding: 8px 12px; }
    .powered-by { margin-top: 10px; }
  }
</style>
</head>
<body>
<div class="grain"></div>
<div class="header">
  <div class="header-left">
    <div class="brand-mark">
      <div class="brand-name">AUDIO HOUSE</div>
      <div class="brand-sub">
        <span class="status-dot"></span>
        Store Advisor
      </div>
    </div>
  </div>
  <div class="header-actions">
    <div class="lang-wrapper">
      <button class="icon-btn" id="lang-btn" title="Language">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </button>
      <div class="lang-dropdown" id="lang-dropdown">
        <button class="lang-option active" data-lang="en"
          data-welcome="Welcome to AUDIO HOUSE. Looking for something specific, or just browsing? I can help you compare across any of the brands we carry."
          data-placeholder="Ask anything about the store or our brands...">
          <span class="lang-flag">EN</span> English
          <span class="lang-check">&#10003;</span>
        </button>
        <button class="lang-option" data-lang="fr"
          data-welcome="Bienvenue chez AUDIO HOUSE. Vous cherchez quelque chose en particulier, ou vous regardez ? Je peux vous aider à comparer entre toutes nos marques."
          data-placeholder="Posez votre question sur la boutique ou nos marques...">
          <span class="lang-flag">FR</span> Français
          <span class="lang-check">&#10003;</span>
        </button>
        <button class="lang-option" data-lang="es"
          data-welcome="Bienvenido a AUDIO HOUSE. ¿Buscas algo en concreto, o estás mirando? Puedo ayudarte a comparar entre todas nuestras marcas."
          data-placeholder="Pregunta lo que quieras sobre la tienda o nuestras marcas...">
          <span class="lang-flag">ES</span> Español
          <span class="lang-check">&#10003;</span>
        </button>
        <button class="lang-option" data-lang="de"
          data-welcome="Willkommen bei AUDIO HOUSE. Suchen Sie etwas Bestimmtes, oder schauen Sie sich nur um? Ich helfe Ihnen, zwischen all unseren Marken zu vergleichen."
          data-placeholder="Fragen Sie etwas zum Store oder unseren Marken...">
          <span class="lang-flag">DE</span> Deutsch
          <span class="lang-check">&#10003;</span>
        </button>
        <button class="lang-option" data-lang="it"
          data-welcome="Benvenuto da AUDIO HOUSE. Cerchi qualcosa in particolare, o stai dando un'occhiata? Posso aiutarti a confrontare tra tutti i marchi che trattiamo."
          data-placeholder="Chiedi qualunque cosa sul negozio o sui nostri marchi...">
          <span class="lang-flag">IT</span> Italiano
          <span class="lang-check">&#10003;</span>
        </button>
      </div>
    </div>
    <button class="icon-btn" id="restart-btn" title="New conversation">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>
  </div>
</div>
<div class="chat-window" id="chat"></div>
<div class="footer-container">
  <div class="quick-replies" id="quick-replies"></div>
  <div class="input-wrapper">
    <input type="text" id="input" placeholder="Ask about any product in the store..." autocomplete="off" autocapitalize="sentences" autocorrect="on">
    <div class="send-btn-wrapper" id="send-wrapper">
      <div class="wave-ring"></div>
      <div class="wave-ring"></div>
      <div class="wave-ring"></div>
      <button class="send-btn" id="send-btn" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="11" y="4" width="2" height="16" rx="1" fill="#F5F1EA"/>
          <rect x="7" y="7" width="2" height="10" rx="1" fill="#F5F1EA"/>
          <rect x="3" y="9" width="2" height="6" rx="1" fill="#F5F1EA"/>
          <rect x="15" y="7" width="2" height="10" rx="1" fill="#F5F1EA"/>
          <rect x="19" y="9" width="2" height="6" rx="1" fill="#F5F1EA"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="powered-by">Powered by <a href="https://squ-ai.vercel.app/" target="_blank" rel="noopener">SQU</a></div>
</div>
<script>
const CONFIG = {
  storeName: "AUDIO HOUSE",
  webhook: "https://n8n.srv1208833.hstgr.cloud/webhook/distributor_chat",
  currency: "EUR",
  welcome: "Welcome to AUDIO HOUSE. Looking for something specific, or just browsing? I can help you compare across any of the brands we carry."
};

const questionsPerLang = {
  en: ["Best speaker under €1000", "Compare Bose and Sonos", "For running outdoors", "For a small apartment", "Looking for a gift idea"],
  fr: ["Meilleure enceinte sous 1000 €", "Comparer Bose et Sonos", "Pour courir en extérieur", "Pour un petit appartement", "Idée cadeau"],
  es: ["Mejor altavoz bajo 1000 €", "Comparar Bose y Sonos", "Para correr al aire libre", "Para un apartamento pequeño", "Idea de regalo"],
  de: ["Bester Lautsprecher unter 1000 €", "Bose vs. Sonos", "Zum Joggen draußen", "Für eine kleine Wohnung", "Geschenkidee"],
  it: ["Miglior diffusore sotto i 1000 €", "Confronta Bose e Sonos", "Per correre all'aperto", "Per un piccolo appartamento", "Idea regalo"]
};

let chatId = 'dist_' + Math.random().toString(36).substr(2, 9);
let currentLang = 'en';
let isSending = false;

const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendWrapper = document.getElementById('send-wrapper');

function triggerWave() {
  sendWrapper.classList.remove('rippling');
  void sendWrapper.offsetWidth;
  sendWrapper.classList.add('rippling');
  setTimeout(() => sendWrapper.classList.remove('rippling'), 800);
}

function parseMarkdown(text) {
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/(?<!href=")(https?:\/\/[^\s<"]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/^[\*\-] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  const lines = html.split('\n');
  return lines.map(line => {
    const t = line.trim();
    if (!t) return '';
    if (/^<(ul|ol|li|h[1-6])/.test(t)) return t;
    return `<p>${t}</p>`;
  }).filter(Boolean).join('\n');
}

function addMsg(text, type) {
  const wrapper = document.createElement('div');
  wrapper.className = `message-wrapper ${type}`;
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (type === 'bot') {
    const label = document.createElement('div');
    label.className = 'bot-label';
    label.textContent = `${CONFIG.storeName} Advisor`;
    wrapper.appendChild(label);
  }
  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${type}`;
  if (type === 'bot') {
    msgDiv.innerHTML = parseMarkdown(text);
  } else {
    msgDiv.textContent = text;
  }
  wrapper.appendChild(msgDiv);
  const timeDiv = document.createElement('div');
  timeDiv.className = 'message-time';
  timeDiv.textContent = time;
  wrapper.appendChild(timeDiv);
  chat.appendChild(wrapper);
  scrollChatToBottom();
}

function scrollChatToBottom() {
  requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
}

function showTyping() {
  const div = document.createElement('div');
  div.id = 'typing';
  div.className = 'message-wrapper bot';
  const label = document.createElement('div');
  label.className = 'bot-label';
  label.textContent = `${CONFIG.storeName} Advisor`;
  div.appendChild(label);
  const msg = document.createElement('div');
  msg.className = 'message bot';
  msg.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  div.appendChild(msg);
  chat.appendChild(div);
  scrollChatToBottom();
}

async function handleSend(textOverride) {
  const text = textOverride || input.value.trim();
  if (!text || isSending) return;
  input.value = '';
  document.getElementById('quick-replies').style.display = 'none';
  isSending = true;
  input.disabled = true;
  document.getElementById('send-btn').disabled = true;
  triggerWave();
  addMsg(text, 'user');
  showTyping();
  try {
    const res = await fetch(CONFIG.webhook, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        chatId,
        language: currentLang,
        currency: CONFIG.currency
      })
    });
    const data = await res.json();
    if (document.getElementById('typing')) document.getElementById('typing').remove();
    addMsg(data.reply || "I'm having trouble connecting. Please try again.", 'bot');
  } catch(e) {
    if (document.getElementById('typing')) document.getElementById('typing').remove();
    addMsg("Connection issue. Please check your network and try again.", 'bot');
  } finally {
    isSending = false;
    input.disabled = false;
    document.getElementById('send-btn').disabled = false;
    if (!('ontouchstart' in window) && window.innerWidth > 640) {
      input.focus();
    }
  }
}

function init() {
  chat.innerHTML = '';
  addMsg(CONFIG.welcome, 'bot');
  const qr = document.getElementById('quick-replies');
  qr.innerHTML = '';
  qr.style.display = 'flex';
  const questions = questionsPerLang[currentLang] || questionsPerLang.en;
  questions.forEach(q => {
    const b = document.createElement('button');
    b.className = 'qr-btn';
    b.textContent = q;
    b.onclick = () => handleSend(q);
    qr.appendChild(b);
  });
}

document.getElementById('send-btn').onclick = (e) => { e.preventDefault(); handleSend(); };
input.addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); handleSend(); } });

document.getElementById('restart-btn').onclick = () => {
  chatId = 'dist_' + Math.random().toString(36).substr(2, 9);
  init();
};

const langBtn = document.getElementById('lang-btn');
const langDropdown = document.getElementById('lang-dropdown');
langBtn.onclick = (e) => { e.stopPropagation(); langDropdown.classList.toggle('open'); };
document.addEventListener('click', () => { langDropdown.classList.remove('open'); });
langDropdown.addEventListener('click', (e) => { e.stopPropagation(); });

document.querySelectorAll('.lang-option').forEach(opt => {
  opt.onclick = () => {
    currentLang = opt.dataset.lang;
    document.querySelectorAll('.lang-option').forEach(o => o.classList.remove('active'));
    opt.classList.add('active');
    CONFIG.welcome = opt.dataset.welcome;
    input.placeholder = opt.dataset.placeholder;
    langDropdown.classList.remove('open');
    chatId = 'dist_' + Math.random().toString(36).substr(2, 9);
    init();
  };
});

window.addEventListener('resize', scrollChatToBottom);
if (window.visualViewport) window.visualViewport.addEventListener('resize', scrollChatToBottom);
chat.addEventListener('scroll', () => { if (chat.scrollLeft !== 0) chat.scrollLeft = 0; });

init();
</script>
</body>
</html>
